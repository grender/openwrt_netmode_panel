# Панель netmoded против мок-сервера — чтобы потыкать интерфейс без роутера.
#
#   docker compose up
#   → http://localhost:8088
#
# Мок отдаёт те же golden-фикстуры из docs/api/examples/, против которых
# потом сверяются Go-обработчики. Панель и демон разрабатываются от одного
# контракта, поэтому расхождение видно здесь, а не на живом железе.
#
# Docker тут не обязателен: `node web/mock-server.mjs` делает ровно то же
# самое и не требует демона Docker. Compose удобен тем, что не надо думать
# о версии Node.
#
# ВАЖНО: отдаётся СОБРАННАЯ панель из web/panel/dist, а не исходники.
# Сначала `make panel`. Прежняя строчка «файл сохранил, вкладку обновил»
# перестала быть правдой в тот день, когда у панели появилась сборка:
# у дев-сервера нет ни минификации, ни вынесенного CSS, и смотреть здесь
# надо ровно то, что поедет на роутер. Авторская петля с горячей
# перезагрузкой — это `make dev`.

services:
  panel:
    image: node:22-alpine
    container_name: netmoded-panel
    working_dir: /app
    command: node web/mock-server.mjs 8088
    ports:
      - "8088:8088"
    volumes:
      # Только чтение: мок ничего не пишет на диск. Собранная панель
      # приезжает из web/panel/dist — пересобрать её нужно снаружи
      # (`make panel`), контейнер этого не делает и делать не должен:
      # он поднимается ради того, чтобы посмотреть, а не собрать.
      - ./web:/app/web:ro
      - ./docs/api/examples:/app/docs/api/examples:ro
    environment:
      NODE_ENV: development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
