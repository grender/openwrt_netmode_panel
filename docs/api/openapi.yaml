openapi: 3.1.0

info:
  title: netmoded — HTTP API панели управления роутером
  version: "1.0.0-phase1"
  description: |
    Единственный источник правды для обоих треков разработки: Go-обработчики и
    фронтенд пишутся по этому файлу, а не друг по другу.

    ## Что нужно знать до чтения

    - **Только LAN.** Сервер слушает адрес из `netmode.main.listen`
      (сид `192.168.9.1`). `0.0.0.0` запрещён. ADR-0014.
    - **Токен** `Authorization: Bearer <…>` обязателен на всех `/api/*`.
      Файл `/etc/netmoded/token`, права 0600.
    - **`/api/status` опрашивается 1 Гц** (SPEC §7). Внешние вызовы внутри него
      кэшируются 500 мс. WebSocket и SSE не используются — ADR-0017.
    - **Формат ошибок один на все коды** — см. `docs/contracts/errors.md`
      и схему `Error`.
    - **Пароли только на запись.** В ответах есть `has_key: bool`, поля `key`
      нет никогда. ADR-0012.
    - **Идентификатор сети — имя секции UCI** (`wifinet0`), не индекс
      `@wifi-iface[N]`. ADR-0005.
    - **Фаза 1 не меняет поведение станционного радио.** Демон трогает только
      выключенные секции и не вызывает применения. ADR-0009. Какое радио
      станционное — выводится из системы, а не задано константой; не
      выяснилось — `503 radio_unknown`. ADR-0019.
    - Времена — RFC 3339 в UTC (`…Z`).

    ## Эндпоинты SPEC §7, которых здесь нет

    `POST /api/confirm` — **удалён**. Он подтверждал взведённый откат;
    автоматического отката нет ни в какой форме (ADR-0006), подтверждать
    нечего. Запрос к нему получит `404 not_found`.

    ## Отложено

    `POST /api/upstream` документирован и всегда отвечает `501` с объясняющим
    телом — ADR-0016. Блокеры: RQ-03, RQ-04.

    ## Состояние разведки

    Clash API у Nikki **проверен** (`evidence.json` → `nikki.status:
    "verified"`): порт 9090, адрес из `nikki.mixin.api_listen`, секрет из
    `nikki.mixin.api_secret`, аутентификация `Authorization: Bearer`.
    **RQ-01 закрыт**, и `/api/nikki/*` больше не отвечают `503` безусловно —
    они ходят в живой Clash API и отдают `503` только когда он молчит.

    Остаются открытыми RQ-02, RQ-03, RQ-05 и RQ-06; что именно каждый из них
    блокирует, помечено на месте.

    ## Расхождения кода и контракта в этой поставке

    Ниже описан контракт. Там, где демон его сейчас **не** исполняет, стоит
    пометка `НЕ РЕАЛИЗОВАНО` прямо в соответствующем месте. Механического
    сторожа формы JSON в проекте нет (`check-routes.sh` видит только пути),
    поэтому такие расхождения ловятся чтением и обязаны быть выписаны, а не
    подразумеваться.

servers:
  - url: http://192.168.9.1:8088
    description: |
      LAN-адрес роутера. Адрес и порт — из `netmode.main.listen` и
      `netmode.main.port`. Порт 8088, а не 8080: 8080 занят mihomo
      (`docs/recon/raw/25-netstat.txt`).

security:
  - bearerAuth: []

tags:
  - name: status
  - name: mode
  - name: wifi
  - name: nikki
  - name: b4
  - name: subscription

paths:

  /api/status:
    get:
      tags: [status]
      summary: Полная картина состояния
      description: |
        Опрашивается фронтендом раз в секунду. **Никогда не отвечает 409, 501
        или 503**: недоступность внешних компонентов выражается полями
        (`b4.available`, `nikki.available`, `associated_ssid: null`), а не
        кодом. Иначе лежащий b4 ослеплял бы всю панель.

        Внешние вызовы (ubus, b4, Clash API) кэшируются 500 мс; `uci show
        wireless` читается каждый раз — из него берётся `wireless_fingerprint`.
      responses:
        "200":
          description: Состояние
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
              examples:
                single:       { $ref: "#/components/examples/StatusSingle" }
                ambiguous:    { $ref: "#/components/examples/StatusAmbiguous" }
                allDisabled:  { $ref: "#/components/examples/StatusAllDisabled" }
                empty:        { $ref: "#/components/examples/StatusEmpty" }
                b4Down:       { $ref: "#/components/examples/StatusB4Unavailable" }
                jobRunning:   { $ref: "#/components/examples/StatusJobRunning" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/mode:
    post:
      tags: [mode]
      summary: Сменить режим обработки трафика
      description: |
        Медленная операция (5–15 с): `uci set netmode.main.mode` + commit,
        затем `/usr/local/bin/netmode-apply <mode>`. Джоб и светодиод —
        ADR-0013, SPEC §8.

        UCI пишется **до** запуска скрипта: конфиг хранит намерение, скрипт
        приводит систему к намерению. Если скрипт упал, намерение сохранено,
        джоб в состоянии `failed`, повтор возможен. Отката нет — ADR-0006.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum: [nikki, b4, off]
      responses:
        "202":
          description: Джоб принят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            `job_busy` — уже выполняется джоб. Очереди нет сознательно
            (SPEC §6): второй запрос отбивается.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/upstream:
    post:
      tags: [wifi]
      summary: Сменить активную upstream-сеть — ОТЛОЖЕНО ДО ФАЗЫ 2
      description: |
        **Всегда отвечает 501 в этой поставке.** Форма запроса заморожена
        сейчас, чтобы фронтенд не переписывался в фазе 2.

        Причины отсрочки (ADR-0016): нет автоматического отката (ADR-0006);
        не отвечены RQ-03 (существует ли применение только к radio0, или
        домашняя точка `grenderNet` моргает — радио делят одну phy0) и RQ-04
        (рвёт ли скан активную ассоциацию).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: Имя секции UCI сохранённой сети
                  examples: ["wifinet2"]
      responses:
        "501":
          description: Не реализовано в этой поставке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: not_implemented
                error: >-
                  Переключение внешней сети появится во второй фазе: сначала
                  надо выяснить, можно ли применить изменение только к
                  станционному радио, не уронив домашнюю сеть — оба радио делят
                  одну phy0 (RQ-03).

  /api/wifi/scan:
    get:
      tags: [wifi]
      summary: Скан эфира
      description: |
        `ubus call iwinfo scan` по интерфейсу станции. И станционное радио, и
        имя интерфейса **выводятся** из `network.wireless status`
        (`<radio>.interfaces[]` — `config.mode == "sta"`, оттуда же `ifname` и
        `config.band`), не хардкодятся — `scripts/check-no-hardcoded-if.sh`,
        порядок разрешения в ADR-0019.

        Станция работает в ОДНОМ диапазоне, поэтому **скан физически не может
        показать сети другого**. Поле `band` и текст `note` существуют, чтобы
        панель это написала: отсутствие знакомой сети иначе выглядит как баг.
        На снимке роутера станция на 2.4 ГГц, но это факт снимка, а не
        константа: `band` отдаёт то, что выяснено, а `note` следует за ним.

        Синхронный, без джоба, хотя и медленный: ничего не меняет, результат
        нужен целиком (ADR-0013).

        Фикстура ответа снята — `docs/recon/raw/23-ubus-iwinfo-scan.json`,
        разбор проверяется на ней в `wireless.ParseScan`. RQ-04 (рвёт ли скан
        активную ассоциацию) закрыт **косвенно**: скан выполнялся при живой
        ассоциации, и она пережила его. Прямой проверки не было.
      responses:
        "200":
          description: Результат скана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            `radio_unknown` — не выяснено, какое радио работает станцией: ни
            в `network.wireless status`, ни в `/etc/config/wireless` нет
            интерфейса с `mode=sta`. Демон не берёт радио наугад (ADR-0019).

            `ifname_unknown` — радио выяснено, но имя его интерфейса не
            выводится (радио выключено, ubus не ответил).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/wifi/networks:
    get:
      tags: [wifi]
      summary: Сохранённые upstream-сети
      description: |
        Секции `wifi-iface` из `/etc/config/wireless` с `mode=sta` на
        станционном радио (ADR-0003). Какое радио станционное — **выводится**
        из системы, а не задано: `mode=sta` в `network.wireless status`, при
        выключенном радио — секция `wifi-iface` в UCI (ADR-0019). Домашняя
        точка доступа (на снимке роутера — `wifinet1`, `grenderNet`,
        `mode=ap`) в список не входит на любом радио.

        Порядок — как в файле. `ETag` и поле `fingerprint` содержат одно и то
        же значение; оно требуется в `If-Match` при записи.
      responses:
        "200":
          description: Список
          headers:
            ETag:
              schema: { type: string }
              description: Отпечаток `/etc/config/wireless`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworksResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            `radio_unknown` — не выяснено, какое радио работает станцией.
            Демон не берёт радио наугад (ADR-0019).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [wifi]
      summary: Создать или изменить сохранённую сеть
      description: |
        Быстрая операция: `uci set` + `uci commit wireless`, десятки
        миллисекунд, синхронный ответ. **Применения нет** — ни `wifi reload`,
        ни джоба, ни светодиода (ADR-0009).

        Без `id` — создание. Секция создаётся именованной (`netmode_<8 hex>`)
        и **всегда с `disabled='1'`**: отсутствие `disabled` означает
        «включена», а создать включённую станционную секцию фаза 1 не вправе.
        Это единственное место, где демон вообще пишет `disabled`.

        С `id` — правка существующей. Разрешена только для **выключенной**
        секции; правка включённой отбивается `409 enabled_network_readonly`.

        `key` отсутствует в теле → пароль не меняется. `key: ""` → записывается
        пустой пароль (осмысленно при `encryption: "none"`). Это разные вещи.

        **Незнакомые поля отвергаются** — `400 unsupported_field`. Демон не
        принимает того, чего не понимает: молча пропущенное поле выглядит как
        выполненная просьба. В частности `network` (выбор L3-сети) — это
        смена upstream, отложенная до фазы 2 (ADR-0016).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkWrite" }
      responses:
        "200":
          description: Записано. Тело — обновлённый список, как у `GET`.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworksResponse" }
        "400":
          description: |
            `bad_request` — тело не разбирается, нет обязательного поля,
            значение вне набора.
            `unsupported_field` — в теле поле, которого нет в `NetworkWrite`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WifiWriteConflict" }
        "503":
          description: |
            `radio_unknown` — не выяснено, какое радио работает станцией.
            Демон не берёт радио наугад (ADR-0019).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/wifi/networks/{id}:
    delete:
      tags: [wifi]
      summary: Удалить сохранённую сеть
      description: |
        Разрешено только для выключенной секции. Удаление включённой —
        `409 enabled_network_readonly` (ADR-0009). Как и правка: `uci delete` +
        `uci commit`, без применения.

        `id` в пути — имя секции. Индексы `@wifi-iface[N]` не принимаются
        никогда: они сдвигаются при удалении в LuCI и указали бы на чужую сеть
        (ADR-0005).
      parameters:
        - $ref: "#/components/parameters/NetworkId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Удалено. Тело — обновлённый список.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworksResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WifiWriteConflict" }
        "503":
          description: |
            `radio_unknown` — не выяснено, какое радио работает станцией.
            Демон не берёт радио наугад (ADR-0019).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/nikki/proxies:
    get:
      tags: [nikki]
      summary: Узлы группы PROXY с задержками
      description: |
        **RQ-01 закрыт**, эндпоинт реализован и ходит в живой Clash API
        (порт 9090, секрет из `nikki.mixin.api_secret`, `Authorization:
        Bearer`). `503 nikki_unavailable` означает ровно то, что написано:
        Clash API не ответил — а не «не реализовано».

        `503 group_missing` — Clash API ответил, но группы `PROXY` в профиле
        нет. Отдельный код, потому что чинится это правкой профиля, а не
        ожиданием.

        По SPEC §7 группа `PROXY` должна быть `selector`, а не `url-test`, и
        обязана содержать пункт `AUTO` (вложенный `url-test`) — он же
        состояние по умолчанию. Без `AUTO` ломается fail-closed: группа
        `BYPASS` видит `PROXY` как один элемент и не отличает «выбран мёртвый
        узел» от «всё умерло».
      responses:
        "200":
          description: Узлы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxiesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/NikkiError" }
        "503": { $ref: "#/components/responses/NikkiUnavailable" }

  /api/nikki/panel:
    get:
      tags: [nikki]
      summary: Полный адрес веб-панели mihomo (единственный ответ с секретом)
      description: |
        Отдаёт адрес дашборда вместе с секретом Clash API:

            http://<хост из Host>:<порт>/ui/?host=…&hostname=…&port=…&secret=…

        **Отдельный запрос, а не поле `/api/status`.** Статус опрашивается раз
        в секунду; секрет в нём ездил бы в каждом ответе и оседал в кэше
        браузера, в devtools и в любом снимке панели. `links.nikki` отдаёт
        адрес **без параметров** — «куда идти», — и у ссылки при этом остаётся
        настоящий `href`: работают средний клик, «открыть в новой вкладке»,
        «копировать адрес». Секрет добирается этим запросом по клику.

        **`GET`, а не `POST`.** Операция читающая и без побочных эффектов;
        `POST` на чтение — ложь контракту. Явность действия обеспечивает не
        метод, а то, что запрос делает обработчик клика, а не опрос страницы.

        **Форма адреса снята с самого LuCI**
        (`raw/71-luci-nikki-open-dashboard.txt`, `tools/nikki.js
        openDashboard`): параметры идут в query, а не в hash; их четыре;
        `host` и `hostname` дублируются намеренно — разные дашборды читают
        разное имя. Схема `http`, потому что `api_tls_listen` на снимке не
        задан; подкаталога после `/ui/` нет, потому что не задан
        `external-ui-name`. Собирается адрес **целиком в Go**
        (`nikki.PanelURL`): шаблон — внешнее знание, и жить оно обязано рядом
        с `evidence.json`, где его стережёт `check-evidence` (шаблон `/ui*`),
        а не в панели, где его не проверит ни один гейт.

        Это **не противоречит** записи «`?secret=` не работает» в
        `docs/recon/nikki.md`: там секрет предъявляли самому Clash API,
        который принимает только заголовок `Authorization`. Здесь параметр
        уходит статике дашборда, а она уже сама кладёт значение в заголовок.
        Статика авторизации не требует — `GET /ui/` отвечает `200 OK` без
        единого заголовка (`raw/73-nikki-ui-probe.txt`); иначе ссылка из
        браузера была бы невозможна в принципе.

        **Перед выдачей делается живая проба `/ui/`.** Дашборд (zashboard)
        скачивается с GitHub при первом запуске nikki, и без интернета его
        там просто нет. Без пробы секрет уехал бы в адресную строку — и осел
        в истории браузера, в автодополнении и в синхронизации профиля —
        ради страницы `404`. Проба идёт по петле, дешёвая и делается только
        по клику, поэтому не кэшируется.

        Ответ отдаётся с `Cache-Control: no-store`. Ни адрес, ни секрет **не
        попадают в журнал демона ни при одном исходе** — поэтому тексты
        отказов написаны словами, а не собраны из ошибки клиента.
      responses:
        "200":
          description: Адрес собран. Тело содержит секрет — не кэшировать, не логировать.
          headers:
            Cache-Control:
              schema: { type: string, enum: ["no-store"] }
              description: Обязателен. В теле секрет, и его копия в кэше пережила бы ротацию.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NikkiPanel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            Три различимых отказа, все `503` и в порядке «чинится в браузере →
            чинится на роутере»:

            - `host_unknown` — по заголовку `Host` адрес роутера не
              выводится: пусто, петля (`localhost`, `127.0.0.1`, `[::1]`) или
              недопустимые символы. Панель открыта через ssh-туннель, и
              ссылка вела бы на машину владельца. Та же таблица, что у
              `links` (см. `Links`).
            - `nikki_unconfigured` — не заданы `nikki.mixin.api_listen` (из
              него берётся порт) или `nikki.mixin.api_secret`. Без секрета
              панель откроется, но не войдёт, и отдавать заведомо нерабочий
              адрес значит врать кнопкой.
            - `panel_missing` — живая проба `/ui/` вернула не-`2xx`: статика
              дашборда не скачана (`nikki.mixin.ui_url`) или движок не
              запущен.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/nikki/proxy:
    post:
      tags: [nikki]
      summary: Выбрать узел (быстрая операция)
      description: |
        Быстрая: Clash API, ~0.2 с, без джоба и без светодиода (SPEC §5).

        Ручной выбор трактуется как временное действие. Возврат к
        автоматическому — тот же запрос с `{"name": "AUTO"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Имя узла или `AUTO` для возврата к url-test
                  examples: ["AUTO"]
      responses:
        "200":
          description: Выбрано. Тело — как у `GET /api/nikki/proxies`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxiesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `group_not_selectable` — группа не принимает ручной выбор. Это
            `409`, а не `501`: конфликт с текущим профилем mihomo, а не
            отсутствующая в демоне возможность. Чинится правкой профиля.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/NikkiError" }
        "503": { $ref: "#/components/responses/NikkiUnavailable" }

  /api/nikki/test:
    post:
      tags: [nikki]
      summary: Замерить задержки всех узлов — НЕ РЕАЛИЗОВАНО
      description: |
        **НЕ РЕАЛИЗОВАНО в этой поставке.** Маршрут не зарегистрирован в
        `Server.routes()`, поэтому запрос получает `405` от `http.ServeMux`,
        а не тело ниже. Панель кнопку показывает и в неё упирается.

        Блокер — RQ-06: форма ответа `GET /proxies/{name}/delay` у mihomo не
        снята, а замер без неё пришлось бы писать по догадке. Разрешается
        одним чтением, записанным в `evidence.json` → `open_questions`.

        Форма ответа заморожена здесь, чтобы панель не переписывалась, когда
        замер появится.
      responses:
        "200":
          description: Замерено. Тело — как у `GET /api/nikki/proxies`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxiesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/NikkiError" }
        "503": { $ref: "#/components/responses/NikkiUnavailable" }

  /api/b4/sets:
    get:
      tags: [b4]
      summary: Сеты b4
      description: |
        `GET /api/sets` у b4 (`127.0.0.1:7000`, аутентификации нет,
        `docs/recon/b4-api.md`). Массив плоский и никогда не `null`.

        **У b4 нет «текущего сета»**: у каждого свой флаг `enabled`, включённых
        может быть несколько, порядок задаёт приоритет. Эксклюзивность —
        наша семантика (ADR-0008). Поэтому:

        - ровно один включён → `selected` = имя, `enabled_count: 1`;
        - ноль → `selected: null`, `enabled_count: 0`;
        - два и более → `selected: null`, `enabled_count: N`. Это не ошибка и
          не повод «чинить»; следующее нажатие в панели приведёт к одному.

        `id` показывается для отладки, но клиент шлёт **имя**: `id` — UUID,
        генерируемый сервером, и может смениться при пересоздании сета.
      responses:
        "200":
          description: Сеты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/B4Error" }
        "503": { $ref: "#/components/responses/B4Unavailable" }

  /api/b4/set:
    post:
      tags: [b4]
      summary: Выбрать сет эксклюзивно (быстрая операция)
      description: |
        Два вызова `POST /api/sets/batch-set-enabled`: сначала гасим все
        прочие, потом зажигаем целевой. Порядок важен — при обрыве между
        вызовами остаёмся без обработки (заметно и безопасно), а не с двумя
        включёнными (тихое изменение приоритетов).

        Клиент шлёт **`id`**, а не имя: `name` в b4 не уникален и ключом не
        является (`docs/recon/b4-api.md`). Отсюда же следует, что кода
        `ambiguous_set_name` на этом пути не бывает — угадывать нечего, адрес
        точный.

        `updated: 0` от b4 — **не ошибка**: значение уже стояло.

        Применяется горячо, рестарт b4 не нужен, выбор переживает рестарт
        (`src/http/handler/config.go:439` — файл пишется до подмены конфига).
        Поэтому `/etc/b4/b4.json` мы не трогаем — ADR-0007.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: >-
                    UUID сета из `GET /api/b4/sets`. Именно `id`, а не `name`:
                    имя не уникально и ключом не является.
                  examples: ["4d1f9a2e-7c30-4b58-9a61-0e2f8b7c1d34"]
      responses:
        "200":
          description: Переключено. Тело — как у `GET /api/b4/sets`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `b4_partial` — прочие сеты погашены, целевой включить не удалось:
            обход DPI сейчас выключен целиком. Это 409, а не 503, потому что
            b4 отвечает, состояние изменено — но не то, о котором просили, и
            помогает именно повтор, а не ожидание. Отката нет намеренно
            (ADR-0006, ADR-0010): сервис, не ответивший на включение, с той же
            вероятностью не ответит и на компенсацию.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/B4Error" }
        "503": { $ref: "#/components/responses/B4Unavailable" }

  /api/subscription/update:
    post:
      tags: [subscription]
      summary: Обновить подписку (джоб)
      description: |
        Запускает `happ2clash` (2–10 с) — джоб, без светодиода (SPEC §5).
        Скрипт держит собственный `flock`, ручной запуск из ssh безопасен.

        Предохранитель конвертера сохранён: при нуле распарсенных узлов старый
        файл провайдера не перезаписывается, джоб завершается как `failed`,
        в лог пишется строка со `status: "fail"`.
      responses:
        "202":
          description: Джоб принят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`job_busy`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: "`internal` — джоб не удалось завести."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            `unavailable` — планировщик не настроен. В штатной сборке
            недостижимо (`NewServer` заводит его всегда); ветка существует
            для конфигураций без планировщика.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/logs:
    get:
      tags: [subscription]
      summary: Лог обновлений подписки
      description: |
        Построчный JSON из `/etc/nikki/updates.log` (SPEC §9). Файл обрезается
        до последних 200 строк. `/var` не годится — tmpfs, история теряется при
        перезагрузке.

        Порядок в ответе — **новые первыми**, независимо от порядка в файле.
      parameters:
        - name: n
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Строки лога
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: "`read_failed` — журнал не прочитался."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Токен из `/etc/netmoded/token` (0600). Сравнение постоянного времени.
        Заголовки CORS не отдаются никогда.

        Токен принимается тремя способами (`Server.tokenOK`): заголовком
        `Authorization: Bearer`, параметром `?token=` в адресе и кукой
        `netmode_token`. Кука ставится сервером, когда токен пришёл ссылкой:
        за `<script src>` браузер не отправляет ни заголовок, ни query, и без
        куки панель грузилась бы с `200` на главной и `401` на всех запросах.
        Статика тоже под токеном — она раскрывает имена сетей.

        **Проверки `Origin` нет.** ADR-0014 описывает `403 forbidden_origin`
        как существующий второй механизм защиты от CSRF; в коде его нет
        (`grep Origin internal/` пуст). Единственная защита — `SameSite=Strict`
        у куки. Это известное и не закрытое расхождение.

  parameters:
    NetworkId:
      name: id
      in: path
      required: true
      description: Имя секции UCI, например `wifinet2`. Индексы не принимаются.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_]+$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Отпечаток `/etc/config/wireless`, полученный из `ETag` или из поля
        `fingerprint`. Не совпал — `409 fingerprint_mismatch`, запись не
        выполняется. Отсутствует — `409 fingerprint_required`.

        Оба случая `409`, а не `400`: заголовка нет не потому, что запрос
        кривой, а потому, что клиент не доказал знание текущего состояния —
        это конфликт представлений, и чинится он перечитыванием списка.
        ADR-0011 называет здесь `400`; побеждает код.
      schema: { type: string }

  responses:
    BadRequest:
      description: "`bad_request`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized` — нет или неверен Bearer-токен"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    B4Unavailable:
      description: |
        `b4_unavailable` — b4 не ответил, ответил не `200` либо клиент не
        настроен.

        `b4_auth_required` **зарезервирован и не отдаётся**: на этом роутере
        `auth_check` вернул `auth_required: false`, и ветка подбора пароля не
        написана — включённая аутентификация деградирует в `b4_unavailable`
        (`internal/b4/b4.go`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    B4Error:
      description: |
        `b4_error` — b4 ответил, но не так, как мы понимаем: неразобранное
        тело, отказ на конкретный запрос (`b4.ErrRejected`), непредвиденный
        код. Отличается от `503` тем, что ждать бесполезно — сервис жив.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NikkiError:
      description: |
        `nikki_error` — Clash API ответил, но не так, как мы понимаем
        (`nikki.StatusError` с непредвиденным кодом, неразобранное тело).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NikkiUnavailable:
      description: |
        `nikki_unavailable` — Clash API не ответил.
        `group_missing` — ответил, но группы `PROXY` в профиле нет.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WifiWriteConflict:
      description: |
        Один из случаев, перечисленных в `docs/contracts/errors.md`:
        `foreign_staged_changes`, `fingerprint_required`,
        `fingerprint_mismatch`, `ambiguous_selection`,
        `enabled_network_readonly`.

        Фактический порядок проверок в `openWrite`: чужой стейджинг →
        разрешение станционного радио (`503 radio_unknown`) → отпечаток →
        неоднозначность выбора; затем, уже в `target`, — сама секция
        (`404 not_found`, `409 enabled_network_readonly`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    Error:
      type: object
      description: |
        Одна форма тела на все коды ответа. Описана здесь **так, как её
        действительно отдаёт демон** (`writeErr` → `apiError` в
        `internal/httpapi/server.go`), а не так, как её задумывал
        `docs/contracts/errors.md`.

        **Расхождение с `errors.md`, известное и не закрытое.** Контракт
        ошибок описывает тело `{error: <машинный код>, message: <текст>,
        details: {…}}`. Демон отдаёт `{code: <машинный код>, error: <текст>}`
        и **никогда не отдаёт `details`** — поля нет в структуре. Панель
        разбирает ответ по `e.code` (`web/app.js`, таблица `ERR_KEY`), то есть
        живёт по этой схеме, а не по `errors.md`.

        Сводить их должен владелец, и решение это не документное: либо демон
        переименовывает поля и заводит `details`, либо `errors.md` признаёт
        текущие имена. До тех пор здесь описан провод, потому что по контракту
        пишут клиентов, а клиент разбирает то, что пришло.
      required: [code, error]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Машинный код. Стабилен, часть контракта, единственное, на что
            клиенту разрешено программировать. Переименование = смена версии
            API.
          enum:
            # --- запрос ---
            - bad_request
            - unsupported_field
            - unauthorized
            - not_found
            # --- состояние системы (409) ---
            - job_busy
            - ambiguous_selection
            - foreign_staged_changes
            - fingerprint_required
            - fingerprint_mismatch
            - enabled_network_readonly
            - b4_partial
            - group_not_selectable
            # --- не реализовано ---
            - not_implemented
            # --- внешняя зависимость (503) ---
            - b4_unavailable
            - nikki_unavailable
            - group_missing
            - host_unknown
            - nikki_unconfigured
            - panel_missing
            - ubus_unavailable
            - uci_unavailable
            - scan_failed
            - radio_unknown
            - ifname_unknown
            - unavailable
            # --- чужой сервис ответил не так (502) ---
            - b4_error
            - nikki_error
            # --- наша ошибка (500) ---
            - internal
            - parse_failed
            - write_failed
            - commit_failed
            - read_failed
            # --- ЗАРЕЗЕРВИРОВАНЫ: описаны контрактом, но демон их не
            #     отдаёт ни на одном пути. Оставлены в наборе, чтобы имена
            #     не были заняты под другой смысл, когда механизм появится.
            #
            #     forbidden_origin  — проверки Origin нет (ADR-0014 её
            #                         описывает как существующую).
            #     method_not_allowed— 405 отдаёт http.ServeMux своим текстом
            #                         мимо writeErr, то есть НЕ этой формой.
            #     ambiguous_set_name— выбор сета адресуется по id, имя ключом
            #                         не является; угадывать нечего.
            #     b4_auth_required  — на этом роутере auth_check вернул
            #                         auth_required:false, ветка не написана.
            - forbidden_origin
            - method_not_allowed
            - ambiguous_set_name
            - b4_auth_required
        error:
          type: string
          description: |
            Текст для человека, по-русски. Меняется свободно — на него не
            программируют. Секретов не содержит: ни `key`, ни токена, ни
            значений опций (ADR-0012).

    JobEnvelope:
      type: object
      description: |
        Обёртка вокруг джоба в ответах `202`. Джоб лежит под ключом `job`, а не
        в корне: `POST /api/mode` и `POST /api/subscription/update` отдают
        `{"job": {…}}` (`writeJSON(w, 202, map[string]any{"job": j})`).
      required: [job]
      additionalProperties: false
      properties:
        job: { $ref: "#/components/schemas/Job" }

    Status:
      type: object
      description: |
        Порядок полей здесь = порядок полей в Go-структуре = порядок ключей в
        примерах `docs/api/examples/status-*.json`.

        Сторожа у этого совпадения НЕТ: ни один тест не сверяет ответ с
        примером, `scripts/check-routes.sh` видит только пути. Форма
        синхронизируется руками, в том же коммите, что и правка Go-структуры.
      required:
        - generated_at
        - hostname
        - mode
        - selection_state
        - configured_ssid
        - associated_ssid
        - pending_apply
        - wireless_fingerprint
        - ap
        - online
        - links
        - job
        - subscription
        - last_fail
        - nikki
        - b4
      additionalProperties: false
      properties:
        generated_at:
          type: string
          format: date-time
          description: Момент сборки ответа. Позволяет отличить свежие данные от застрявших.
        hostname:
          type: string
          description: "`os.Hostname()`. Панель показывает, какой роутер перед вами."
        mode:
          type: string
          enum: [nikki, b4, off, unknown]
          description: |
            Из `netmode.main.mode` — единственное подлинно собственное состояние
            демона. `unknown` = в файле лежит значение вне набора (**мы его не
            исправляем**, ADR-0010) **либо прочитать UCI не удалось**.

            `off` означает только «владелец выключил» или «записи ещё нет»
            (свежая установка). Сбой чтения под `off` не маскируется: иначе
            панель показала бы выключенный тумблер над работающим режимом.
        selection_state:
          $ref: "#/components/schemas/SelectionState"
        configured_ssid:
          type: [string, "null"]
          description: |
            SSID **включённой** секции. Не `null` только при
            `selection_state: "single"`. См. `docs/contracts/state-machine.md`.
        associated_ssid:
          type: [string, "null"]
          description: |
            SSID, к которому радио **реально подключено** (`iwinfo info`).
            С `configured_ssid` не сливается никогда: их расхождение — самый
            полезный сигнал в панели.
        conflict:
          type: array
          items: { type: string }
          description: |
            Секции, из-за которых выбор оказался неоднозначным: либо несколько
            включённых станционных, либо нераспознанное значение `disabled`.

            **Ключ присутствует только при `selection_state: "ambiguous"`** —
            единственное поле статуса с `omitempty` вне `nikki`/`b4`. Пустой
            массив здесь означал бы «конфликт есть, участники неизвестны», а
            такого состояния не бывает: конфликт и определяется списком
            участников.
        pending_apply:
          type: boolean
          description: |
            `<radio>.pending` из `network.wireless status`: конфигурация
            изменена, но не применена. В фазе 1 наши записи применения не
            вызывают, поэтому `true` после нашей записи — штатно (ADR-0009).
        wireless_fingerprint:
          type: string
          description: |
            `sha256:` + первые 16 hex-символов sha256 от вывода
            `uci show wireless`. Совпадает с `ETag` в `/api/wifi/networks`.
            Панель по нему замечает чужую правку без второго запроса.
          examples: ["sha256:1f0c9a3b7d2e4a58"]
        ap:
          $ref: "#/components/schemas/AP"
        online:
          $ref: "#/components/schemas/Online"
        links:
          $ref: "#/components/schemas/Links"
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
          description: |
            Текущий джоб или `null`. Завершившийся остаётся видимым **5
            секунд** в состоянии `done`/`failed` (`job.keepFinished`), иначе
            клиент с опросом 1 Гц может не увидеть завершения (ADR-0013).
        subscription:
          $ref: "#/components/schemas/SubscriptionStatus"
        last_fail:
          oneOf:
            - $ref: "#/components/schemas/LastFail"
            - type: "null"
          description: |
            Последняя неудачная попытка подключиться к upstream-сети.
            **В фазе 1 всегда `null`**: мы не переключаем upstream (ADR-0016).
            Поле существует, чтобы фронтенд не переписывался в фазе 2.
        nikki:
          $ref: "#/components/schemas/NikkiStatus"
        b4:
          $ref: "#/components/schemas/B4Status"

    SelectionState:
      type: string
      enum: [empty, all_disabled, single, ambiguous]
      description: |
        `empty` — станционных секций нет (свежая установка, **нормально**, 200).
        `all_disabled` — есть, все выключены (**нормально**, 200).
        `single` — ровно одна включена, рабочее состояние.
        `ambiguous` — включено ≥2 либо `disabled` не распознан: все записи в
        `wireless` отбиваются `409`, автопочинки нет никогда.

    AP:
      type: object
      description: Домашняя точка доступа (`radio1`, `wifinet1`). Мы её не трогаем.
      required: [ssid, band, clients]
      additionalProperties: false
      properties:
        ssid:
          type: string
          description: >-
            `""`, если секция домашней точки не нашлась или её радио не
            выяснено. Не `null`: поле всегда строка.
        band:
          type: string
          description: >-
            Из `<radio>.config.band` того радио, у которого нашёлся интерфейс
            с `mode=ap` (ADR-0019), например `5g`. `""` — не выяснено.
        clients:
          type: [integer, "null"]
          description: |
            Число ассоциированных клиентов. `null` = неизвестно.
            NEEDS RECON: в `network.wireless status` массив `stations` пуст —
            неизвестно, наполняется ли он вообще. Проверить:
            `ubus call iwinfo assoclist '{"device":"<ifname AP>"}'`.
            До ответа поле всегда `null`.

    Online:
      type: object
      required: [ok, checked, checked_at]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          description: |
            **Означает «upstream L3 поднят»**, а не «интернет работает»:
            интерфейс `wwan` (proto dhcp) активен, имеет адрес и маршрут по
            умолчанию. Внешних проб мы не делаем — они требуют литерала чужого
            хоста, которого нет в `evidence.json`.

            При `checked: false` значение всегда `false` и **ничего не
            означает**: см. ниже.
        checked:
          type: boolean
          description: |
            Удалось ли вообще выяснить состояние канала: `ubus
            network.interface.wwan status` ответил **и** ответ разобрался.

            Без этого признака `ok: false` означает сразу две разные вещи —
            «связи нет» и «спросить не смогли». Первое чинится сетью, второе
            демоном. Панель обязана показывать их по-разному: при
            `checked: false` состояние канала неизвестно, а не «оффлайн».
        checked_at:
          type: string
          format: date-time

    Links:
      type: object
      description: |
        Ссылки на собственные веб-морды сервисов — адреса для браузера
        владельца, а не адреса, по которым ходит демон.

        **Хост берётся из заголовка `Host` запроса**, а не из конфигурации:
        панель могли открыть по имени (`router.lan`), по IPv4, по IPv6 — и
        ссылка обязана вести туда же, откуда пришёл запрос. Порт и схему
        подставляет демон, и оба порта берутся **разбором** известного адреса,
        а не вторым литералом: b4 — из `b4.DefaultBaseURL`, nikki — из
        адреса Clash API, выведенного при старте из `nikki.mixin.api_listen`.

        Поэтому ссылки собираются **на каждый запрос, в обработчике**, а не
        в `StatusReader.build`: снимок из `build` кэшируется на 500 мс и
        уходит разным клиентам, так что адрес первого зашедшего утёк бы
        второму (`TestStatusLinksFollowRequestHostNotCache`).

        **Не вывелось — `null`, а не догадка.** Если из `Host` не выходит
        имя, пригодное для ссылки, соответствующее поле остаётся `null`:

        | `Host` | Результат |
        |---|---|
        | пусто (HTTP/1.0 без заголовка) | `null` |
        | `localhost`, `*.localhost`, `127.0.0.1`, `[::1]` — любая петля | `null` |
        | символы вне `A-Za-z0-9.-_:` | `null` |
        | всё остальное | ссылка, порт свой |

        Петля отвергается не из осторожности вообще, а по конкретной причине:
        панель могли открыть через ssh-туннель (`http://localhost:8088/`), и
        тогда `http://localhost:7000/` указывал бы на ноутбук владельца, а не
        на роутер. Отличить туннель от прямого обращения демон не может и
        угадывать не будет — тот же принцип, что `503 radio_unknown` в
        ADR-0019. Проверяет `TestPanelHost`.

        **К `available` ссылки НЕ привязаны, и это намеренно.** Ссылка — это
        адрес, а не проба живости: владелец скорее полезет в морду b4 именно
        тогда, когда b4 демону не отвечает. Связывать одно с другим не надо.

        `null` означает «адрес неизвестен», а НЕ «сервиса нет»: клиент не
        имеет права достраивать ссылку сам — ни из своего
        `window.location`, ни из `hostname` в этом же ответе (это имя хоста
        роутера, а не адрес, по которому до него дошёл браузер).
      required: [nikki, b4]
      additionalProperties: false
      properties:
        nikki:
          type: [string, "null"]
          description: |
            Адрес веб-панели Nikki **без параметров**:
            `http://<хост из Host>:<порт>/ui/`.

            Собирается из ДВУХ источников: хост — из заголовка `Host`
            запроса, порт — из конфигурации (`nikki.mixin.api_listen`,
            разбором адреса Clash API, `nikki.PanelPort`). Хост из
            конфигурации взять нельзя: там `127.0.0.1`, по которому ходит
            демон, — в браузере владельца это его собственная машина. Путь
            `/ui/` подтверждён разведкой (`raw/73-nikki-ui-probe.txt`:
            `200 OK`, `text/html`, без заголовка авторизации; дашборд —
            zashboard), и отдельного порта у панели нет: `external-controller
            '[::]:9090'` — единственный слушатель.

            **Секрета здесь нет и не будет ни при каких условиях**
            (`TestStatusNeverLeaksSecret` — единственный механический сторож
            этого решения). Статус опрашивается раз в секунду; секрет ездил бы
            в каждом ответе. Полный адрес с `?secret=` отдаёт
            `GET /api/nikki/panel` по клику и с `no-store`. У ссылки при этом
            остаётся настоящий `href`, то есть средний клик и «копировать
            адрес» работают — секрет добирается уже после.

            `null` — когда хост из `Host` вывести не удалось (см. таблицу
            выше) либо порт не выводится из `nikki.mixin.api_listen`. От
            `nikki.available` НЕ зависит: ссылка — это адрес, а не проба
            живости.
          examples: ["http://192.168.9.1:9090/ui/"]
        b4:
          type: [string, "null"]
          description: |
            Адрес веб-морды b4: `http://<хост из Host>:7000/`. Порт 7000
            подтверждён разведкой (`raw/50-b4-api.txt`: `:::7000`, то есть
            вся LAN, и `/api/auth/check` → `{"auth_required": false}` — на
            снимке морда открывается без входа). Порт берётся разбором
            `b4.DefaultBaseURL`, а не отдельным литералом
            (`TestPanelURLTakesPortFromConfirmedBaseURL`).

            IPv6-хост скобкуется: `Host: [fd00::1]:8088` даёт
            `http://[fd00::1]:7000/` (`TestPanelURLBracketsIPv6`).

            `null` — когда хост из `Host` вывести не удалось (см. таблицу
            выше). От `b4.available` НЕ зависит.
          examples: ["http://192.168.9.1:7000/"]

    Job:
      type: object
      description: |
        Медленная операция. Одновременно живёт ровно одна; второй запрос —
        `409 job_busy`, очереди нет (SPEC §6).
        Поля `finished_at` и `error` добавлены к набору из мокапа: без них
        упавший джоб при опросе 1 Гц неотличим от успешного.
      required: [id, kind, arg, label, started_at, finished_at, eta_sec, state, error]
      additionalProperties: false
      properties:
        id:
          type: string
          examples: ["j-7f3a1c"]
        kind:
          type: string
          enum: [mode, subscription]
          description: "`upstream` появится в фазе 2 (ADR-0016)."
        arg:
          type: string
          description: >
            Уточнение операции: для `kind=mode` это целевой режим
            (`nikki`|`b4`|`off`), для `subscription` — пустая строка.
            Панель строит подпись из `kind`+`arg` на своём языке, поэтому
            поле машинное и переводу не подлежит.
          examples: ["b4"]
        label:
          type: string
          description: >
            Человекочитаемая метка для журнала демона и диагностики по ssh,
            по-русски. Панель её НЕ показывает: иначе русский текст попадал
            бы в английский интерфейс. Для панели существуют `kind` и `arg`.
          examples: ["Переключение режима на b4"]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        eta_sec:
          type: integer
          description: Ожидаемая длительность из таблицы SPEC §5. Оценка, не обещание.
        state:
          type: string
          enum: [running, done, failed]
        error:
          type: [string, "null"]
          description: Заполнено только при `failed`. Секретов не содержит.

    LastFail:
      type: object
      required: [ssid, reason, at]
      additionalProperties: false
      properties:
        ssid: { type: string }
        reason:
          type: string
          description: Причина, пригодная для показа. Пароль не упоминается.
        at:
          type: string
          format: date-time

    NikkiStatus:
      type: object
      description: |
        Состояние движка nikki. Форма общая с `B4Status`: в Go оба поля
        статуса — одна структура `Service`, и расходиться они не могут.
      required: [available, version, set, enabled_count]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: >-
            Ответил ли Clash API на запрос списка узлов. RQ-01 закрыт, так что
            `false` означает молчание движка, а не отсутствие реализации.
        version:
          type: [string, "null"]
          description: "`null`, пока движок не ответил."
        set:
          type: string
          description: |
            Текущий узел группы `PROXY` (`AUTO` — состояние по умолчанию).
            `""` — движок недоступен или узел не выбран. Не `null`: поле
            всегда строка.
          examples: ["AUTO"]
        pinned:
          type: boolean
          description: |
            Узел закреплён вручную. **Ключ отсутствует, если `false`** —
            единственное поле статуса с `omitempty`: признак осмыслен только
            при `available: true`, а его отсутствие читается как «не
            закреплено».
        enabled_count:
          type: integer
          minimum: 0
          description: |
            К nikki не относится и всегда `0` — поле есть, потому что состояние
            обоих движков описывается одной структурой. Смысл оно имеет только
            в `B4Status`.

    B4Status:
      type: object
      required: [available, version, set, enabled_count]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: "Проба `GET /api/version` — единственный маршрут b4 вне аутентификации."
        version:
          type: [string, "null"]
          description: "`null`, пока b4 не ответил на `GET /api/version`."
          examples: ["1.74.1"]
        set:
          type: string
          description: |
            Имя сета, если включён ровно один. `""` при нуле, при двух и более
            и при недоступном b4 — эксклюзивность наша, не b4 (ADR-0008).
            Не `null`: поле всегда строка, различать случаи следует по
            `available` и `enabled_count`.
        pinned:
          type: boolean
          description: |
            К b4 не относится; ключ в объекте `b4` не появляется. См.
            `NikkiStatus.pinned`.
        enabled_count:
          type: integer
          minimum: 0
          description: |
            Сколько сетов включено. **Присутствует всегда, включая `0`** — это
            факт «b4 отвечает, включённых сетов нет», а не отсутствие данных.
            При `available: false` тоже `0`, и различать эти два случая нужно
            по `available`.

    SubscriptionStatus:
      type: object
      description: |
        Последняя строка `/etc/nikki/updates.log`. Восстанавливается из файла,
        а не из памяти: после перезапуска демона картина обязана сходиться
        (SPEC §12).
      required: [last_update, status, nodes, error]
      additionalProperties: false
      properties:
        last_update:
          type: [string, "null"]
          format: date-time
          description: "`null` — обновлений ещё не было."
        status:
          type: string
          enum: [ok, fail, never]
          description: |
            `never` — журнал пуст или нечитаем: подписка ни разу не
            обновлялась в этой установке. Это **не** `null`: поле всегда
            строка, и отсутствие истории — такой же факт, как её наличие.
        nodes:
          type: integer
          minimum: 0
          description: >-
            Сколько узлов разобрал конвертер в последний раз. `0` при
            `status: "never"` и при `status: "fail"` — не `null`.
        error:
          type: [string, "null"]
          description: "`null`, если ошибки не было."

    NetworksResponse:
      type: object
      required: [fingerprint, selection_state, radio, networks]
      additionalProperties: false
      properties:
        fingerprint:
          type: string
          description: То же значение, что в `ETag` и в `status.wireless_fingerprint`.
        selection_state:
          $ref: "#/components/schemas/SelectionState"
        radio:
          type: object
          required: [device, band, mode]
          additionalProperties: false
          properties:
            # device и band ВЫВЕДЕНЫ из системы, а не заданы: какое радио
            # работает станцией и в каком диапазоне, решает mode=sta в
            # network.wireless status, при выключенном радио — секция
            # wifi-iface в UCI (ADR-0019). Примеры — снимок этого роутера.
            device: { type: string, examples: ["radio0"] }
            band:   { type: string, examples: ["2g"] }
            mode:   { type: string, examples: ["sta"] }
        networks:
          type: array
          items: { $ref: "#/components/schemas/Network" }

    Network:
      type: object
      required: [id, ssid, encryption, has_key, network, enabled, editable]
      additionalProperties: false
      properties:
        id:
          type: [string, "null"]
          description: |
            Имя секции UCI. `null` — секция безымянная: показываем и учитываем
            при классификации, но не трогаем (ADR-0005).

            Пустая строка на месте `null` не приходит никогда: в JS она
            ложно-истинна и склеивается в валидный путь
            `/api/wifi/networks/`, то есть «сеть без адреса» дошла бы до
            `DELETE`. `null` падает раньше.
          examples: ["wifinet2"]
        ssid: { type: string }
        encryption:
          type: string
          examples: ["psk2", "none"]
        has_key:
          type: boolean
          description: |
            У секции есть непустой `key`. **Самого `key` в ответе нет никогда**
            — не `null` и не маска, ключа нет в JSON (ADR-0012).

            Отвечает ровно на этот вопрос и ни на какой другой: у открытой сети
            (`encryption: "none"`) — всегда `false`, потому что пароля в секции
            нет. «Можно ли подключиться без пароля» — вопрос про `encryption`.
        network:
          type: string
          description: L3-интерфейс, к которому привязана секция.
          examples: ["wwan"]
        enabled:
          type: boolean
          description: |
            Выведено из `disabled`: опции нет или `'0'` → `true`. Значение вне
            набора уводит весь выбор в `ambiguous` (ADR-0004).
        editable:
          type: boolean
          description: |
            `false`, если правка запрещена: секция включена, безымянная, либо
            `selection_state == "ambiguous"`. Готовое решение для UI, чтобы
            панель не повторяла правила ADR-0009 у себя.

    NetworkWrite:
      type: object
      description: |
        Набор полей закрыт. `additionalProperties: false` здесь не декорация:
        демон разбирает тело строгим декодером и отвечает
        `400 unsupported_field` на любое поле вне этого списка.

        Обязательное зависит от операции: создание (без `id`) требует `ssid` и
        `encryption`, правка требует `id`. Отсюда `anyOf` вместо общего
        `required`.
      additionalProperties: false
      anyOf:
        - required: [id]
        - required: [ssid, encryption]
      properties:
        id:
          type: string
          description: Имя секции. Отсутствует или пусто — создание новой.
        ssid:
          type: string
          minLength: 1
          maxLength: 32
        encryption:
          type: string
          examples: ["psk2", "none"]
        key:
          type: string
          description: |
            **Отсутствие поля и пустая строка — разные вещи.** Нет поля —
            пароль не меняется. `""` — записывается пустой (при
            `encryption: "none"`). В Go — `*string`.

      # Поля `network` здесь нет и не будет до фазы 2. Секция всегда создаётся
      # на `wwan` (raw/11-uci-show-network.txt). Выбор L3-сети станционной
      # секции — это и есть смена upstream, отложенная ADR-0016 до ответов на
      # RQ-03 и RQ-04. Пока поле стояло в схеме, а демон его выбрасывал,
      # контракт обещал функцию, которой нет; теперь оно отвергается
      # с `400 unsupported_field`.

    ScanResponse:
      type: object
      required: [scanned_at, ifname, band, note, networks]
      additionalProperties: false
      properties:
        scanned_at: { type: string, format: date-time }
        ifname:
          type: string
          description: Выведен из `network.wireless status`, не хардкодится.
          examples: ["phy0.0-sta0"]
        band:
          type: string
          examples: ["2g", "5g"]
          description: |
            `config.band` того радио, у которого нашёлся интерфейс с
            `mode=sta`. Не `const`: привязка «радио ↔ диапазон» выводится из
            системы, а не задана (ADR-0019). Пустая строка означает «радио
            выяснено, диапазон — нет».
        note:
          type: string
          description: |
            Готовый текст для панели о том, каких сетей в списке не будет.
            Поле существует, чтобы это нельзя было забыть показать, и
            **следует за `band`**: утверждение «видны только 2.4 ГГц» на
            пятигигагерцовой станции проверяемо ложно.
        networks:
          type: array
          items: { $ref: "#/components/schemas/ScanResult" }

    ScanResult:
      type: object
      description: |
        Одна сеть из `ubus call iwinfo scan`. Разбирается `wireless.ParseScan`
        на записанном выводе роутера — `raw/23-ubus-iwinfo-scan.json`.

        Порядок полей повторяет структуру `wireless.ScanResult`: `channel`
        стоит **перед** `encryption`.
      required: [ssid, bssid, hidden, signal_dbm, quality, quality_max, channel, encryption]
      additionalProperties: false
      properties:
        ssid:
          type: string
          description: Пустая строка = скрытая сеть.
        bssid: { type: string }
        hidden:
          type: boolean
          description: >-
            Сеть не сообщает SSID. Отдельный флаг, потому что пустой `ssid`
            иначе неотличим от сети, у которой имя не разобралось.
        signal_dbm: { type: integer }
        quality: { type: integer }
        quality_max: { type: integer }
        channel: { type: integer }
        encryption:
          type: string
          description: Нормализовано к тем же значениям, что в UCI.
        saved_id:
          type: [string, "null"]
          description: |
            Имя секции сохранённой сети с таким же SSID, если есть. Панель по
            нему показала бы «уже сохранена».

            **НЕ РЕАЛИЗОВАНО.** Поля нет в `wireless.ScanResult`, и демон его
            не отдаёт ни разу. Поэтому оно не в `required`: пример с `saved_id`
            описывает намерение, а не ответ. Сопоставление требует читать
            `wireless` на пути скана, чего сейчас не делается.

    NikkiPanel:
      type: object
      description: |
        Ответ `GET /api/nikki/panel`. **Единственное тело в этом API, в
        котором есть секрет.** Не кэшировать, не логировать, не показывать в
        интерфейсе: панели полагается открыть адрес, а не отрисовать его.

        Поле одно и содержит адрес **целиком**, а не части. Это сделано
        специально: шаблон (`/ui/`, четыре параметра, query вместо hash) —
        внешнее знание, снятое с LuCI, и собранный из кусков в браузере он не
        проверялся бы ни одним гейтом.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: >-
            Полный адрес дашборда с секретом. Хост — из заголовка `Host`
            запроса, порт — из `nikki.mixin.api_listen`, параметры — по форме
            LuCI (`raw/71-luci-nikki-open-dashboard.txt`). Секрет
            URL-кодируется (`url.Values`), поэтому `&`, пробел и непечатные
            символы в нём безопасны.
          examples: ["http://192.168.9.1:9090/ui/?host=192.168.9.1&hostname=192.168.9.1&port=9090&secret=..."]

    ProxiesResponse:
      type: object
      description: |
        Группа `PROXY` и её участники. Тело собирается из `map`, поэтому
        порядок ключей — алфавитный, а не как здесь; порядок в `members`
        значим и повторяет порядок группы в mihomo.
      required: [available, version, group, type, selected, fixed, pinned, selectable, members]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: >-
            `true`, если Clash API ответил. Ветки `false` в теле `200` нет:
            недоступность отдаётся кодом `503 nikki_unavailable`.
        version:
          type: string
          description: >-
            Версия mihomo. `""` — список получен, а проба версии не прошла:
            терять список из-за украшения не станем.
          examples: ["v1.19.27"]
        group:
          type: string
          const: PROXY
          description: >-
            Имя фиксировано профилем (SPEC §2) и не настраивается: опция дала
            бы способ выбрать чужую группу и сломать fail-closed незаметно.
        type:
          type: string
          description: >-
            Тип группы в mihomo. На этом роутере `URLTest`
            (`evidence.json` → RQ-01), не `Selector`, как предполагала SPEC §7.
          examples: ["URLTest", "Selector"]
        selected:
          type: string
          description: >-
            Участник, через который группа работает **сейчас** (`now` в
            mihomo). `""` — группа ничего не выбрала.
        fixed:
          type: string
          description: >-
            Участник, закреплённый вручную (`selected` в mihomo). `""` —
            автовыбор. Отличает «выбрано руками» от «движок так решил»:
            по одному `selected` это неразличимо.
        pinned:
          type: boolean
          description: Закреплён ли выбор вручную. То же различие, одним флагом.
        selectable:
          type: boolean
          description: >-
            Принимает ли группа ручной выбор. Отказ приходит как
            `409 group_not_selectable`, а не `501`: это конфликт с текущим
            профилем, а не отсутствующая возможность.
        members:
          type: array
          items: { $ref: "#/components/schemas/Proxy" }

    Proxy:
      type: object
      description: |
        Узел или вложенная группа. Форма общая: в Go это одна структура
        `nikki.Proxy`, и расходиться они не могут.
      required: [name, type, alive, delay_ms, pinned, selectable]
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string, examples: ["URLTest", "Vless"] }
        alive:
          type: boolean
          description: |
            Последняя **успешная** проба, а не последняя вообще.

            Ключ присутствует всегда, включая `false`: у `nikki.Proxy.Alive`
            нет `omitempty`, в отличие от соседних `members`, `now` и `fixed`.
            Прежняя редакция обещала обратное, и по ней из примера убрали
            `"alive": false` — клиент, читавший отсутствие ключа как сигнал,
            получил бы от демона совсем другое.
        delay_ms:
          type: [integer, "null"]
          description: |
            Задержка последней пробы. `null` — пробы не было.

            Именно `null`, а не `0`: mihomo пишет `delay: 0` при
            несостоявшейся пробе (`raw/60-clash-proxies.json`), и превратить
            это в «ноль миллисекунд» значило бы показать мёртвый узел самым
            быстрым.
        members:
          type: array
          items: { type: string }
          description: >-
            Имена участников. Заполнено только у групп; **ключ отсутствует**
            у обычного узла (`omitempty`).
        now:
          type: string
          description: >-
            Участник, через который группа работает сейчас. **Ключ
            отсутствует**, если пусто (`omitempty`).
        fixed:
          type: string
          description: >-
            Закреплённый вручную участник. **Ключ отсутствует**, если пусто
            (`omitempty`) — то есть при автовыборе.
        pinned: { type: boolean }
        selectable: { type: boolean }

    SetsResponse:
      type: object
      required: [available, version, selected, enabled_count, sets]
      additionalProperties: false
      properties:
        available: { type: boolean }
        version:
          type: string
          description: "`\"\"` — проба версии не прошла, хотя список сетов получен."
          examples: ["1.74.1"]
        selected:
          type: string
          description: |
            Имя, если включён ровно один. Иначе `""` — не `null`: ключ
            присутствует всегда, отличать «ни одного» от «несколько» следует
            по `enabled_count`.
        enabled_count:
          type: integer
          minimum: 0
          description: Присутствует всегда, включая `0`.
        sets:
          type: array
          description: Порядок из b4 = приоритет обработки. Не сортировать.
          items:
            type: object
            required: [id, name, enabled]
            additionalProperties: false
            properties:
              id:
                type: string
                description: |
                  UUID от b4. Показан для отладки; **клиент шлёт имя**, потому
                  что `id` может смениться при пересоздании сета.
              name:
                type: string
                description: Не уникален и ключом не является.
              enabled: { type: boolean }

    LogsResponse:
      type: object
      required: [path, n, lines]
      additionalProperties: false
      properties:
        path:
          type: string
          const: /etc/nikki/updates.log
        n:
          type: integer
          description: Сколько строк вернули (не сколько запросили).
        lines:
          type: array
          description: Новые первыми.
          items:
            type: object
            required: [ts, nodes, status, err]
            additionalProperties: false
            properties:
              ts: { type: string, format: date-time }
              nodes: { type: integer }
              status: { type: string, enum: [ok, fail] }
              err:
                type: string
                description: |
                  Текст ошибки; `""` при `status: "ok"`. Ключ присутствует
                  всегда: пропущенный читатель не отличил бы от «писатель про
                  него не знал». Не `null` — поле всегда строка.

  examples:
    StatusSingle:
      summary: Состояние снимка разведки — John24 активна, ATOM сохранена, режим nikki
      externalValue: examples/status-single.json
    StatusAmbiguous:
      summary: Две включённые станционные секции — запись запрещена
      externalValue: examples/status-ambiguous.json
    StatusAllDisabled:
      summary: Сети есть, ни одна не выбрана
      externalValue: examples/status-all-disabled.json
    StatusEmpty:
      summary: Свежая установка — станционных секций нет
      externalValue: examples/status-empty.json
    StatusB4Unavailable:
      summary: b4 не отвечает — статус всё равно 200
      externalValue: examples/status-b4-unavailable.json
    StatusJobRunning:
      summary: Выполняется смена режима
      externalValue: examples/status-job-running.json
