nikki    v1.26.1 aarch64_generic    nikki_aarch64_generic-openwrt-25.12.tar.gz    fbe8b42b42cb2e21fcab350d79463ea7c45dd2cd533cb52191ea8142373b9df3
b4       v1.74.1 arm64              b4-linux-arm64.tar.gz                         7252fe6fa967feb79db477bb39b640f095812278e7bb7fff6f77c1a9742f0bb2
