# Закреплённые версии движков, которые ставит scripts/deploy.sh --install
# на систему, где их ещё нет (ADR-0046). Стенд (VM) и роутер получают одно
# и то же; обновление — осознанная правка этого файла.
#
# Формат: по строке на архив, поля через пробелы.
#   engine   nikki | b4
#   version  тег релиза на GitHub
#   arch     /etc/apk/arch системы (nikki собран под каждую отдельно);
#            у b4 один статический бинарь — arm64 годится любой aarch64_*
#   file     имя архива в релизе
#   sha256   хэш архива; сверен с полем digest в API релизов GitHub
#
# Откуда качается — scripts/engines.sh (ENGINES_NIKKI_BASE, ENGINES_B4_BASE).
#
# nikki v1.26.1 — это nikki 2026.04.08-r1, luci-app-nikki 1.26.1-r1 и
# mihomo-meta 1.19.27, ровно как на роутере на момент закрепления
# (mihomo там позже обновлён из фида до 1.19.29 — deploy об этом
# предупреждает, но не трогает). b4 v1.74.1 — как на роутере.
#
# engine version arch               file                                          sha256
